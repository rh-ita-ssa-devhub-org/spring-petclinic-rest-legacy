# Quarkus configuration for PetClinic

# Server configuration
quarkus.http.port=9966
quarkus.http.root-path=/petclinic/

# Profile for database selection (hsqldb, mysql, postgresql)
quarkus.profile=hsqldb

# Message/i18n configuration
quarkus.i18n.basename=messages/messages

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.panache.enable-supertype-ids=true

# datasource profiles are activated via application-{profile}.properties
# HSQLDB profile
%hsqldb.quarkus.datasource.db-kind=hsqldb
%hsqldb.quarkus.datasource.jdbc.url=jdbc:hsqldb:mem:petclinic
%hsqldb.quarkus.datasource.jdbc.driver=org.hsqldb.jdbc.JDBCDriver
%hsqldb.quarkus.datasource.username=sa
%hsqldb.quarkus.datasource.password=

# MySQL profile
%mysql.quarkus.datasource.db-kind=mysql
%mysql.quarkus.datasource.jdbc.url=jdbc:mysql://localhost/petclinic
%mysql.quarkus.datasource.jdbc.driver=com.mysql.cj.jdbc.Driver
%mysql.quarkus.datasource.username=root
%mysql.quarkus.datasource.password=

# PostgreSQL profile
%postgresql.quarkus.datasource.db-kind=postgresql
%postgresql.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost/petclinic
%postgresql.quarkus.datasource.jdbc.driver=org.postgresql.Driver
%postgresql.quarkus.datasource.username=postgres
%postgresql.quarkus.datasource.password=

# Logging
quarkus.log.category."org.springframework.samples".level=INFO

# Security configuration (default disabled)
petclinic.security.enable=false

# Swagger/OpenAPI
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true
