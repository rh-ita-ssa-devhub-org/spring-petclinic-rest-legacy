# ---------------------------------------------------------------------------
# 7. WebSecurityConfigurerAdapter removal (Spring Security 6)
# ---------------------------------------------------------------------------
- ruleID: springboot2-to-35-security-websecurityconfigureradapter-001
  description: WebSecurityConfigurerAdapter was removed in Spring Security 6 — migrate to SecurityFilterChain bean
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=springboot2
    - konveyor.io/target=springboot35
    - konveyor.io/target=springboot3
  links:
    - title: Spring Security 6 Migration Guide
      url: https://docs.spring.io/spring-security/reference/migration/index.html
    - title: Spring Security Without WebSecurityConfigurerAdapter
      url: https://spring.io/blog/2022/02/21/spring-security-without-the-websecurityconfigureradapter
    - title: Spring Boot 3 Migration Guide
      url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  message: |
    ## WebSecurityConfigurerAdapter has been removed in Spring Security 6

    Spring Security 6 (bundled in Spring Boot 3.x) **completely removed**
    `WebSecurityConfigurerAdapter`. Security configuration must be migrated to a
    component-based model using `SecurityFilterChain` beans.

    ### Before
    ```java
    @Configuration
    @EnableWebSecurity
    public class SecurityConfig extends WebSecurityConfigurerAdapter {
        @Override
        protected void configure(HttpSecurity http) throws Exception {
            http
                .authorizeRequests()
                    .anyRequest().authenticated()
                .and()
                .httpBasic();
        }
    }
    ```

    ### After
    ```java
    @Configuration
    @EnableWebSecurity
    public class SecurityConfig {
        @Bean
        public SecurityFilterChain securityFilterChain(HttpSecurity http) throws Exception {
            http
                .authorizeHttpRequests(auth -> auth
                    .anyRequest().authenticated()
                )
                .httpBasic(Customizer.withDefaults());
            return http.build();
        }
    }
    ```

    ### Additional info
    - Remove `extends WebSecurityConfigurerAdapter` from your security configuration class
    - Convert `configure(HttpSecurity http)` → `@Bean SecurityFilterChain`
    - Convert `configure(WebSecurity web)` → `WebSecurityCustomizer` bean
    - Convert `configure(AuthenticationManagerBuilder auth)` → `AuthenticationManager` bean
    - Replace deprecated `authorizeRequests()` with `authorizeHttpRequests()`
    - Replace `antMatchers()` / `mvcMatchers()` with `requestMatchers()`
    - Use lambda DSL; remove `.and()` method chaining
  when:
    java.referenced:
      pattern: org.springframework.security.config.annotation.web.configuration.WebSecurityConfigurerAdapter
      location: INHERITANCE

# ---------------------------------------------------------------------------
# 8. @EnableGlobalMethodSecurity → @EnableMethodSecurity
# ---------------------------------------------------------------------------
- ruleID: springboot2-to-35-security-enable-global-method-security-001
  description: "@EnableGlobalMethodSecurity is removed in Spring Security 6 — use @EnableMethodSecurity"
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=springboot2
    - konveyor.io/target=springboot35
    - konveyor.io/target=springboot3
  links:
    - title: Spring Security 6 Migration Guide
      url: https://docs.spring.io/spring-security/reference/migration/index.html
    - title: EnableMethodSecurity Javadoc
      url: https://docs.spring.io/spring-security/site/docs/current/api/org/springframework/security/config/annotation/method/configuration/EnableMethodSecurity.html
  message: |
    ## @EnableGlobalMethodSecurity is removed — use @EnableMethodSecurity

    Spring Security 5.6+ deprecated `@EnableGlobalMethodSecurity` in favour of
    `@EnableMethodSecurity`. Spring Security 6 (Spring Boot 3.x) removes it entirely.

    ### Before
    ```java
    @Configuration
    @EnableGlobalMethodSecurity(prePostEnabled = true, securedEnabled = true)
    public class MethodSecurityConfig extends WebSecurityConfigurerAdapter { ... }
    ```

    ### After
    ```java
    @Configuration
    @EnableMethodSecurity(securedEnabled = true)
    // prePostEnabled = true is now the DEFAULT — no need to set it explicitly
    public class MethodSecurityConfig { ... }
    ```

    ### Additional info
    - `@EnableMethodSecurity` enables `prePostEnabled = true` by default (unlike the old
      annotation which defaulted to `false`)
    - `securedEnabled` and `jsr250Enabled` attributes are preserved with the same semantics
    - The new annotation uses `AuthorizationManager` instead of legacy `AccessDecisionManager`
    - SpEL expressions in `@PreAuthorize` / `@PostAuthorize` may evaluate slightly differently;
      test your authorization logic thoroughly after migration
  when:
    java.referenced:
      pattern: org.springframework.security.config.annotation.method.configuration.EnableGlobalMethodSecurity
      location: ANNOTATION

# ---------------------------------------------------------------------------
# 9. authorizeRequests() → authorizeHttpRequests() + lambda DSL
# ---------------------------------------------------------------------------
- ruleID: springboot2-to-35-security-authorize-requests-001
  description: "HttpSecurity.authorizeRequests() removed in Spring Security 6 — use authorizeHttpRequests() with lambda DSL"
  category: mandatory
  effort: 2
  labels:
    - konveyor.io/source=springboot2
    - konveyor.io/target=springboot35
    - konveyor.io/target=springboot3
  links:
    - title: Spring Security 6 Migration Guide
      url: https://docs.spring.io/spring-security/reference/migration/index.html
    - title: Authorizing HTTP Requests
      url: https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html
  message: |
    ## HttpSecurity.authorizeRequests() is removed — use authorizeHttpRequests() with lambda DSL

    Spring Security 6 (Spring Boot 3.x) **removed** the deprecated `authorizeRequests()`
    method. You must migrate to the `authorizeHttpRequests()` lambda-based API.

    ### Before
    ```java
    http
        .authorizeRequests()
            .antMatchers("/api/public/**").permitAll()
            .antMatchers("/api/admin/**").hasRole("ADMIN")
            .anyRequest().authenticated()
        .and()
        .httpBasic()
        .and()
        .csrf().disable();
    ```

    ### After
    ```java
    http
        .authorizeHttpRequests(auth -> auth
            .requestMatchers("/api/public/**").permitAll()
            .requestMatchers("/api/admin/**").hasRole("ADMIN")
            .anyRequest().authenticated()
        )
        .httpBasic(Customizer.withDefaults())
        .csrf(csrf -> csrf.disable());
    return http.build();
    ```

    ### Additional info
    - Replace `authorizeRequests()` with `authorizeHttpRequests()`
    - Replace `antMatchers()` with `requestMatchers()`
    - Replace `mvcMatchers()` with `requestMatchers()` (now uses MVC matching by default)
    - Replace all `.and()` method chaining with the lambda DSL (Spring Security 6 requires it)
    - Replace `.csrf().disable()` with `.csrf(csrf -> csrf.disable())`
    - Replace `.httpBasic()` with `.httpBasic(Customizer.withDefaults())`
    - `hasRole()` still automatically prepends `ROLE_`; `hasAuthority()` does not
  when:
    java.referenced:
      pattern: org.springframework.security.config.annotation.web.builders.HttpSecurity
      location: METHOD_CALL

# ---------------------------------------------------------------------------
# 10. mysql:mysql-connector-java → com.mysql:mysql-connector-j  (pom.xml)
# ---------------------------------------------------------------------------
- ruleID: springboot2-to-35-mysql-connector-artifact-001
  description: MySQL Connector/J artifact was renamed — update pom.xml coordinates
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=springboot2
    - konveyor.io/target=springboot35
    - konveyor.io/target=springboot3
  links:
    - title: MySQL Connector/J 8.0.31 Release Notes
      url: https://dev.mysql.com/doc/relnotes/connector-j/8.0/en/news-8-0-31.html
    - title: Spring Boot 3 Migration Guide
      url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  message: |
    ## mysql-connector-java has been renamed to mysql-connector-j

    MySQL Connector/J renamed its Maven artifact starting with version 8.0.31.
    Spring Boot 3.x BOM manages the new `com.mysql:mysql-connector-j` artifact.

    ### Before
    ```xml
    <dependency>
      <groupId>mysql</groupId>
      <artifactId>mysql-connector-java</artifactId>
      <scope>runtime</scope>
    </dependency>
    ```

    ### After
    ```xml
    <dependency>
      <groupId>com.mysql</groupId>
      <artifactId>mysql-connector-j</artifactId>
      <scope>runtime</scope>
    </dependency>
    ```

    ### Additional info
    - Spring Boot 3.x BOM manages `com.mysql:mysql-connector-j` automatically (no version needed)
    - The old groupId `mysql` with artifactId `mysql-connector-java` is no longer published for 8.0.31+
    - Also update the JDBC driver class name in `application.properties`:
      `spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver`
    - Spring Boot 3.5 is tested with MySQL 8.x and 9.x
  when:
    builtin.filecontent:
      filePattern: pom.xml
      pattern: mysql-connector-java

# ---------------------------------------------------------------------------
# 11. Deprecated MySQL JDBC driver class name  (*.properties)
# ---------------------------------------------------------------------------
- ruleID: springboot2-to-35-mysql-driver-class-001
  description: com.mysql.jdbc.Driver is removed — use com.mysql.cj.jdbc.Driver
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=springboot2
    - konveyor.io/target=springboot35
    - konveyor.io/target=springboot3
  links:
    - title: MySQL Connector/J Migration Guide
      url: https://dev.mysql.com/doc/connector-j/en/connector-j-api-changes.html
  message: |
    ## Deprecated MySQL JDBC driver class name

    The class `com.mysql.jdbc.Driver` was deprecated in MySQL Connector/J 5.1
    and **removed** in version 8.x.

    ### Before
    ```properties
    spring.datasource.driver-class-name=com.mysql.jdbc.Driver
    ```

    ### After
    ```properties
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    ```

    ### Additional info
    - The new driver class is `com.mysql.cj.jdbc.Driver` (available since MySQL Connector/J 6.0+)
    - With Spring Boot 3.x and `com.mysql:mysql-connector-j`, the driver class is auto-detected
      from the JDBC URL prefix `jdbc:mysql://` — the property can often be omitted entirely
    - Also update the pom.xml dependency from `mysql:mysql-connector-java` to `com.mysql:mysql-connector-j`
  when:
    builtin.filecontent:
      filePattern: "*.properties"
      pattern: com.mysql.jdbc.Driver

# ---------------------------------------------------------------------------
# 12. @MockBean → @MockitoBean  (Spring Boot 3.4+ / 3.5 specific)
# ---------------------------------------------------------------------------
- ruleID: springboot2-to-35-mockbean-to-mockitobean-001
  description: "@MockBean is deprecated in Spring Boot 3.4+ — use @MockitoBean from Spring Framework 6.2"
  category: optional
  effort: 1
  labels:
    - konveyor.io/source=springboot2
    - konveyor.io/source=springboot3
    - konveyor.io/target=springboot35
  links:
    - title: Spring Boot 3.4 Release Notes
      url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.4-Release-Notes
    - title: Spring Framework 6.2 @MockitoBean Javadoc
      url: https://docs.spring.io/spring-framework/docs/6.2.x/javadoc-api/org/springframework/test/context/bean/override/mockito/MockitoBean.html
  message: |
    ## @MockBean is deprecated in Spring Boot 3.4+ — use @MockitoBean

    Spring Boot 3.4 (Spring Framework 6.2) introduced `@MockitoBean` and
    `@MockitoSpyBean` as replacements for `@MockBean` and `@SpyBean`.
    The old annotations are deprecated and scheduled for removal.

    ### Before
    ```java
    import org.springframework.boot.test.mock.mockito.MockBean;
    import org.springframework.boot.test.mock.mockito.SpyBean;

    @SpringBootTest
    class MyServiceTest {
        @MockBean
        private MyRepository repository;

        @SpyBean
        private MyService service;
    }
    ```

    ### After
    ```java
    import org.springframework.test.context.bean.override.mockito.MockitoBean;
    import org.springframework.test.context.bean.override.mockito.MockitoSpyBean;

    @SpringBootTest
    class MyServiceTest {
        @MockitoBean
        private MyRepository repository;

        @MockitoSpyBean
        private MyService service;
    }
    ```

    ### Additional info
    - `@MockitoBean` and `@MockitoSpyBean` are in Spring Framework 6.2
      (package `org.springframework.test.context.bean.override.mockito`)
    - Available since Spring Boot 3.4; required for full Spring Boot 3.5 compatibility
    - The old `@MockBean` / `@SpyBean` from `org.springframework.boot.test.mock.mockito`
      are deprecated and will be removed in a future release
    - Functionality is equivalent; no behavioral changes expected
    - This is a Spring Boot 3.4+ / 3.5 specific change (not applicable to 3.0–3.3)
  when:
    java.referenced:
      pattern: org.springframework.boot.test.mock.mockito.MockBean
      location: ANNOTATION
