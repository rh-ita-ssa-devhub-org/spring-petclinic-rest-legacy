# ============================================================================
# Custom MTA Rules: Spring Boot 2.x → Spring Boot 3.5 + Jakarta EE 9+
# ============================================================================
# These rules SUPPLEMENT the default MTA rulesets (jakarta-ee9, hibernate, etc.)
# by covering gaps specific to Spring Boot 3.5 and the patterns found in this
# project (spring-petclinic-rest-legacy, Spring Boot 2.6.2).
#
# Generated by: Scribe MCP (scribe MTA rule generator)
# Target project: /Users/mcombi/demo/spring-petclinic-rest-legacy
# Default MTA rules already cover:
#   - Spring Boot version < 3.0 detection (spring-components-00001)
#   - Spring Framework version < 6.0 detection (spring-components-00002)
#   - Hibernate 3→4 patterns (hibernate ruleset)
#
# These custom rules cover the MISSING patterns:
#   1.  javax.persistence  → jakarta.persistence
#   2.  javax.servlet      → jakarta.servlet
#   3.  javax.transaction  → jakarta.transaction
#   4.  javax.validation   → jakarta.validation
#   5.  javax.xml.bind     → jakarta.xml.bind  (+ pom coordinate change)
#   6.  Springfox          → SpringDoc OpenAPI 2.x  (Java + pom)
#   7.  WebSecurityConfigurerAdapter removal (Spring Security 6)
#   8.  @EnableGlobalMethodSecurity → @EnableMethodSecurity
#   9.  authorizeRequests() → authorizeHttpRequests() + lambda DSL
#   10. mysql-connector-java → mysql-connector-j  (pom)
#   11. com.mysql.jdbc.Driver → com.mysql.cj.jdbc.Driver  (properties)
#   12. @MockBean → @MockitoBean  (Spring Boot 3.4+ / 3.5 specific)
# ============================================================================

# ---------------------------------------------------------------------------
# 1. javax.persistence → jakarta.persistence
# ---------------------------------------------------------------------------
- ruleID: springboot2-to-35-javax-persistence-001
  description: javax.persistence imports must be changed to jakarta.persistence (Jakarta EE 9+)
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=springboot2
    - konveyor.io/target=springboot35
    - konveyor.io/target=springboot3
    - konveyor.io/target=jakarta-ee9+
    - konveyor.io/target=jakarta-ee
  links:
    - title: Jakarta EE 9 Persistence Specification
      url: https://jakarta.ee/specifications/persistence/3.1/
    - title: Spring Boot 3 Migration Guide
      url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  message: |
    ## javax.persistence has moved to jakarta.persistence

    Spring Boot 3.x is built on Spring Framework 6 which requires **Jakarta EE 9+**.
    All `javax.*` namespaces have been renamed to `jakarta.*`.

    ### Before
    ```java
    import javax.persistence.Entity;
    import javax.persistence.Id;
    import javax.persistence.Column;
    import javax.persistence.EntityManager;
    import javax.persistence.PersistenceContext;
    ```

    ### After
    ```java
    import jakarta.persistence.Entity;
    import jakarta.persistence.Id;
    import jakarta.persistence.Column;
    import jakarta.persistence.EntityManager;
    import jakarta.persistence.PersistenceContext;
    ```

    ### Additional info
    - All JPA annotations (`@Entity`, `@Table`, `@Id`, `@Column`, `@OneToMany`, `@ManyToOne`,
      `@MappedSuperclass`, `@PersistenceContext`, etc.) must be updated
    - Spring Boot 3.x manages `jakarta.persistence-api` transitively via `spring-boot-starter-data-jpa`
    - Remove any explicit `javax.persistence:javax.persistence-api` dependency from pom.xml
    - Hibernate 6 (default JPA provider in Spring Boot 3.x) also imports from `jakarta.persistence`
    - Use IDE global find-and-replace to bulk-update all imports
  when:
    java.referenced:
      pattern: javax.persistence.*
      location: IMPORT

# ---------------------------------------------------------------------------
# 2. javax.servlet → jakarta.servlet
# ---------------------------------------------------------------------------
- ruleID: springboot2-to-35-javax-servlet-001
  description: javax.servlet imports must be changed to jakarta.servlet (Jakarta EE 9+)
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=springboot2
    - konveyor.io/target=springboot35
    - konveyor.io/target=springboot3
    - konveyor.io/target=jakarta-ee9+
    - konveyor.io/target=jakarta-ee
  links:
    - title: Jakarta Servlet 5.0 Specification
      url: https://jakarta.ee/specifications/servlet/5.0/
    - title: Spring Boot 3 Migration Guide
      url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  message: |
    ## javax.servlet has moved to jakarta.servlet

    Spring Boot 3.x requires **Jakarta EE 9+** and uses Tomcat 10.x / Jetty 11.x
    which ship Jakarta Servlet 5.0+.

    ### Before
    ```java
    import javax.servlet.http.HttpServletResponse;
    import javax.servlet.http.HttpServletRequest;
    import javax.servlet.Filter;
    import javax.servlet.FilterChain;
    ```

    ### After
    ```java
    import jakarta.servlet.http.HttpServletResponse;
    import jakarta.servlet.http.HttpServletRequest;
    import jakarta.servlet.Filter;
    import jakarta.servlet.FilterChain;
    ```

    ### Additional info
    - Spring Boot 3.x uses Tomcat 10.x / Jetty 11.x which ship Jakarta Servlet 5.0+
    - The `spring-boot-starter-web` dependency manages `jakarta.servlet-api` transitively
    - Check all web filters, listeners, and servlets registered via `@WebFilter`, `@WebListener`, `@WebServlet`
    - Spring Security `HttpSecurity` methods still work but use `jakarta.servlet` internally
  when:
    java.referenced:
      pattern: javax.servlet.*
      location: IMPORT

# ---------------------------------------------------------------------------
# 3. javax.transaction → jakarta.transaction
# ---------------------------------------------------------------------------
- ruleID: springboot2-to-35-javax-transaction-001
  description: javax.transaction imports must be changed to jakarta.transaction (Jakarta EE 9+)
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=springboot2
    - konveyor.io/target=springboot35
    - konveyor.io/target=springboot3
    - konveyor.io/target=jakarta-ee9+
    - konveyor.io/target=jakarta-ee
  links:
    - title: Jakarta Transactions 2.0
      url: https://jakarta.ee/specifications/transactions/2.0/
    - title: Spring Boot 3 Migration Guide
      url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  message: |
    ## javax.transaction has moved to jakarta.transaction

    Spring Boot 3.x requires **Jakarta EE 9+** and the JTA Transaction API has been
    renamed from `javax.transaction` to `jakarta.transaction`.

    ### Before
    ```java
    import javax.transaction.Transactional;
    import javax.transaction.TransactionManager;
    ```

    ### After
    ```java
    import jakarta.transaction.Transactional;
    import jakarta.transaction.TransactionManager;
    ```

    ### Additional info
    - **Important distinction**: Spring's own `@Transactional`
      (`org.springframework.transaction.annotation.Transactional`) is **unaffected**
    - Only the JTA/Jakarta Transaction API (`javax.transaction`) needs renaming
    - Spring Boot 3.x manages `jakarta.transaction-api` transitively via `spring-boot-starter-data-jpa`
    - Verify transaction boundaries after the rename; run full integration tests
  when:
    java.referenced:
      pattern: javax.transaction.*
      location: IMPORT

# ---------------------------------------------------------------------------
# 4. javax.validation → jakarta.validation
# ---------------------------------------------------------------------------
- ruleID: springboot2-to-35-javax-validation-001
  description: javax.validation imports must be changed to jakarta.validation (Jakarta EE 9+)
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=springboot2
    - konveyor.io/target=springboot35
    - konveyor.io/target=springboot3
    - konveyor.io/target=jakarta-ee9+
    - konveyor.io/target=jakarta-ee
  links:
    - title: Jakarta Bean Validation 3.0
      url: https://jakarta.ee/specifications/bean-validation/3.0/
    - title: Spring Boot 3 Migration Guide
      url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  message: |
    ## javax.validation has moved to jakarta.validation

    Spring Boot 3.x bundles Jakarta Bean Validation 3.0 via Hibernate Validator 8.x.

    ### Before
    ```java
    import javax.validation.Valid;
    import javax.validation.Validator;
    import javax.validation.ConstraintViolation;
    import javax.validation.constraints.NotEmpty;
    import javax.validation.constraints.Digits;
    ```

    ### After
    ```java
    import jakarta.validation.Valid;
    import jakarta.validation.Validator;
    import jakarta.validation.ConstraintViolation;
    import jakarta.validation.constraints.NotEmpty;
    import jakarta.validation.constraints.Digits;
    ```

    ### Additional info
    - Spring Boot 3.x bundles Jakarta Bean Validation 3.0 (via Hibernate Validator 8.x)
    - `spring-boot-starter-validation` manages `jakarta.validation-api` transitively
    - Remove any explicit `javax.validation:validation-api` from pom.xml
    - All constraint annotations (`@NotNull`, `@NotEmpty`, `@Size`, `@Digits`, `@Valid`, etc.)
      are unchanged in name; only the package changes
    - Custom validators implementing `ConstraintValidator` must also update their imports
  when:
    java.referenced:
      pattern: javax.validation.*
      location: IMPORT

# ---------------------------------------------------------------------------
# 5. javax.xml.bind → jakarta.xml.bind  (JAXB)
# ---------------------------------------------------------------------------
- ruleID: springboot2-to-35-javax-xml-bind-001
  description: javax.xml.bind (JAXB) imports must be changed to jakarta.xml.bind and coordinates updated
  category: mandatory
  effort: 2
  labels:
    - konveyor.io/source=springboot2
    - konveyor.io/target=springboot35
    - konveyor.io/target=springboot3
    - konveyor.io/target=jakarta-ee9+
    - konveyor.io/target=jakarta-ee
  links:
    - title: Jakarta XML Binding 4.0
      url: https://jakarta.ee/specifications/xml-binding/4.0/
    - title: JAXB removal from JDK (JEP 320)
      url: https://openjdk.org/jeps/320
    - title: Spring Boot 3 Migration Guide
      url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  message: |
    ## javax.xml.bind (JAXB) has moved to jakarta.xml.bind

    JAXB was removed from the JDK in Java 11 and the API has been renamed from
    `javax.xml.bind` to `jakarta.xml.bind` in Jakarta EE 9+.

    ### Before
    ```xml
    <!-- pom.xml -->
    <dependency>
      <groupId>javax.xml.bind</groupId>
      <artifactId>jaxb-api</artifactId>
      <version>2.3.0</version>
    </dependency>
    ```
    ```java
    import javax.xml.bind.annotation.XmlElement;
    import javax.xml.bind.JAXBContext;
    ```

    ### After
    ```xml
    <!-- pom.xml -->
    <dependency>
      <groupId>jakarta.xml.bind</groupId>
      <artifactId>jakarta.xml.bind-api</artifactId>
      <version>4.0.0</version>
    </dependency>
    <dependency>
      <groupId>com.sun.xml.bind</groupId>
      <artifactId>jaxb-impl</artifactId>
      <version>4.0.4</version>
      <scope>runtime</scope>
    </dependency>
    ```
    ```java
    import jakarta.xml.bind.annotation.XmlElement;
    import jakarta.xml.bind.JAXBContext;
    ```

    ### Additional info
    - Spring Boot 3.x does NOT auto-manage a JAXB dependency — add it explicitly if needed
    - A runtime implementation (`com.sun.xml.bind:jaxb-impl` or `org.glassfish.jaxb:jaxb-runtime`)
      is also required at runtime
    - Replace `javax.xml.bind:jaxb-api` with `jakarta.xml.bind:jakarta.xml.bind-api:4.0.0`
  when:
    java.referenced:
      pattern: javax.xml.bind.*
      location: IMPORT

# ---------------------------------------------------------------------------
# 6a. Springfox → SpringDoc OpenAPI 2.x  (Java code)
# ---------------------------------------------------------------------------
- ruleID: springboot2-to-35-springfox-to-springdoc-001
  description: Springfox is incompatible with Spring Boot 3.x — must migrate to SpringDoc OpenAPI 2.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=springboot2
    - konveyor.io/target=springboot35
    - konveyor.io/target=springboot3
  links:
    - title: SpringDoc OpenAPI 2.x Documentation
      url: https://springdoc.org/
    - title: Migrating from Springfox to SpringDoc
      url: https://springdoc.org/migrating-from-springfox.html
    - title: Spring Boot 3 Migration Guide
      url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
  message: |
    ## Springfox is incompatible with Spring Boot 3.x — migrate to SpringDoc OpenAPI 2.x

    Springfox has been **abandoned** (last release 3.0.0 in 2020) and is
    **incompatible** with Spring Boot 3.x (Spring MVC 6+). You must migrate to
    **SpringDoc OpenAPI 2.x**.

    ### Before
    ```xml
    <!-- pom.xml -->
    <dependency>
      <groupId>io.springfox</groupId>
      <artifactId>springfox-boot-starter</artifactId>
      <version>3.0.0</version>
    </dependency>
    ```
    ```java
    @Configuration
    @EnableSwagger2
    @ComponentScan(basePackages = "com.example.rest")
    public class SwaggerConfig {
        @Bean
        public Docket api() {
            return new Docket(DocumentationType.SWAGGER_2)
                .select()
                .apis(RequestHandlerSelectors.any())
                .paths(PathSelectors.any())
                .build();
        }
        // BeanPostProcessor workaround for Spring Boot 2.6+ also removed
    }
    ```

    ### After
    ```xml
    <!-- pom.xml -->
    <dependency>
      <groupId>org.springdoc</groupId>
      <artifactId>springdoc-openapi-starter-webmvc-ui</artifactId>
      <version>2.5.0</version>
    </dependency>
    ```
    ```java
    // No Docket bean required — SpringDoc auto-configures from Spring MVC mappings
    // Swagger UI: /swagger-ui/index.html
    // OpenAPI JSON: /v3/api-docs
    ```

    ### Additional info
    - Remove `springfox-boot-starter` from pom.xml entirely
    - Delete the `@Configuration` class with the `Docket` bean and any Springfox
      `BeanPostProcessor` workarounds
    - Add `springdoc-openapi-starter-webmvc-ui` (use `webflux-ui` for WebFlux projects)
    - Configure via `springdoc.api-docs.*` and `springdoc.swagger-ui.*` properties
    - Replace Swagger 2 annotations (`@ApiOperation`, `@ApiParam`, `@Api`) with
      OpenAPI 3 equivalents (`@Operation`, `@Parameter`, `@Tag`) from
      `io.swagger.v3.oas.annotations`
  when:
    java.referenced:
      pattern: springfox.*
      location: IMPORT

